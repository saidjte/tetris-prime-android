name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Build APK
        run: |
          VERSION_NAME=$(cat version.txt | grep versionName | cut -d= -f2)
          VERSION_CODE=$(cat version.txt | grep versionCode | cut -d= -f2)
          echo "Building v$VERSION_NAME (code: $VERSION_CODE)"
          VERSION_NAME=$VERSION_NAME VERSION_CODE=$VERSION_CODE ./scripts/build.sh

      - name: Verify APK
        run: |
          APK=$(ls build/tetris-prime-*.apk | head -1)
          ./scripts/verify.sh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetris-prime-apk
          path: build/tetris-prime-*.apk
          retention-days: 30

      - name: Upload source archive
        run: |
          VERSION_NAME=$(cat version.txt | grep versionName | cut -d= -f2)
          git archive --format=zip --prefix=tetris-prime-$VERSION_NAME/ HEAD -o build/tetris-prime-src-$VERSION_NAME.zip

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetris-prime-src
          path: build/tetris-prime-src-*.zip
          retention-days: 30
